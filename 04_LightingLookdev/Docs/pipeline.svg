<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Stormfall.Hiss 自定义后处理 pass 设计示意</title>
<desc id="desc">游戏线程读取参数形成值快照并传递给渲染线程。SceneColor 与 SceneDepth 输入 Tonemap 后的 RDG 像素着色 pass Stormfall.Hiss，再输出至后续 pass 或最终输出。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#92b9cc"/></marker></defs>
<rect width="1200" height="650" rx="20" fill="#111820"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#edf3f7">
<text x="42" y="55" font-size="27" font-weight="bold">Stormfall.Hiss · 自定义后处理 pass</text>
<text x="42" y="87" font-size="17" fill="#aabac8">Tonemap 后 · 自定义屏幕空间处理</text>
<rect x="34" y="112" width="1132" height="164" rx="14" fill="#1c2a35"/>
<text x="55" y="144" font-size="19" fill="#9ad7f0">游戏线程</text>
<rect x="62" y="164" width="330" height="80" rx="10" fill="#2c4354"/>
<text x="86" y="196" font-size="20">Actor / Component 参数</text><text x="86" y="224" font-size="16">启用、强度、边缘、色散、侵蚀</text>
<path d="M392 204H496" stroke="#92b9cc" stroke-width="3" marker-end="url(#a)"/>
<rect x="504" y="164" width="324" height="80" rx="10" fill="#2c4354"/>
<text x="530" y="197" font-size="21">值类型参数快照</text><text x="530" y="226" font-size="16">复制数值 · 不传递 UObject 指针</text>
<text x="862" y="194" font-size="17" fill="#b8c9d6">Lighting Presets</text><text x="862" y="222" font-size="16" fill="#b8c9d6">捕获 / 应用</text>
<rect x="34" y="304" width="1132" height="264" rx="14" fill="#24212b"/>
<text x="55" y="339" font-size="19" fill="#f1b6c0">渲染线程 / RDG</text>
<path d="M666 244V365" stroke="#92b9cc" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#a)"/>
<text x="690" y="295" font-size="16" fill="#aabac8">跨线程传递参数快照</text>
<rect x="65" y="365" width="270" height="62" rx="9" fill="#354355"/>
<text x="111" y="404" font-size="23">SceneColor</text>
<rect x="65" y="457" width="270" height="62" rx="9" fill="#354355"/>
<text x="103" y="496" font-size="23">SceneDepth</text>
<path d="M335 396H399V434H487M335 488H399V434" fill="none" stroke="#92b9cc" stroke-width="3" marker-end="url(#a)"/>
<rect x="495" y="370" width="340" height="146" rx="12" fill="#653442" stroke="#d98b98"/>
<text x="545" y="409" font-size="26" font-weight="bold">Stormfall.Hiss</text><text x="618" y="440" font-size="21">RDG PS</text>
<text x="524" y="480" font-size="17">深度边缘 · 色散 · 距离侵蚀</text>
<path d="M835 434H910" stroke="#92b9cc" stroke-width="3" marker-end="url(#a)"/>
<rect x="918" y="391" width="215" height="95" rx="10" fill="#354355"/>
<text x="948" y="429" font-size="21">后续 pass / 输出</text><text x="943" y="460" font-size="16">输出目标由回调提供</text>
<text x="45" y="603" font-size="17" fill="#b8c9d6">渲染线程只读快照，不访问 UObject；强度为 0 时不注册 pass。</text>
<text x="45" y="630" font-size="16" fill="#b8c9d6">输入 SceneColor / SceneDepth，处理后输出至后续 pass 或最终目标。</text>
</g></svg>
